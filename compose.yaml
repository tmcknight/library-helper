# Run on the home server next to cloudflared. Point the tunnel's public hostname at
# http://library-helper:3000 (same Docker network) — no ports need publishing.
# `docker compose up -d` pulls the published image; add `--build` to build from source instead.
services:
  library-helper:
    image: ghcr.io/tmcknight/library-helper:latest
    build: .
    restart: unless-stopped
    env_file: .env # card, PIN and AUTH_MODE settings; see .env.example
    networks: [tunnel]

networks:
  tunnel:
    external: true # the network your cloudflared container is on; rename to match
