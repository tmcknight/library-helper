# Portainer stack. Pulls the image published from v* tags; redeploy with "Re-pull image" on.
# Set the ${...} values under the stack's "Environment variables".
services:
  library-helper:
    image: ghcr.io/tmcknight/library-helper:latest
    container_name: library-helper
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      PORT: "3000"
      LIBRARY_CARD_NUMBER: ${LIBRARY_CARD_NUMBER}
      LIBRARY_PIN: ${LIBRARY_PIN}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
    networks: [nginx-proxy] # shared with cloudflared-tunnel-1

networks:
  nginx-proxy:
    external: true
